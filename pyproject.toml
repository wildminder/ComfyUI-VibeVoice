[project]
# Name intentionally keeps the "ComfyUI-" prefix although the registry
# naming guide says not to: the package is already published under this
# exact ID (see .github/workflows/publish.yml), and renaming would orphan
# the existing registry entry and break updates for installed users.
name = "ComfyUI-VibeVoice"
description = "VibeVoice TTS. Expressive, long-form, multi-speaker conversational audio"
version = "2.8.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# Keep in sync with requirements.txt (guarded by tests/test_pyproject.py).
# bitsandbytes + accelerate serve the transformers 4-bit quantization path
# (BitsAndBytesConfig), which imports them lazily at runtime.
dependencies = ["torch", "torchaudio", "numpy", "huggingface_hub", "accelerate", "soundfile", "tqdm", "safetensors", "transformers>=4.51.3", "diffusers", "bitsandbytes"]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.optional-dependencies]
# Optional audio-resampling fallbacks. torchaudio (a hard dependency) is the
# primary resampler; scipy/librosa are only used if torchaudio is unavailable.
# The node never requires librosa and degrades gracefully without it.
audio-extra = ["scipy", "librosa"]

[project.urls]
Homepage = "https://github.com/wildminder/ComfyUI-VibeVoice"
Documentation = "https://github.com/wildminder/ComfyUI-VibeVoice#readme"
Repository = "https://github.com/wildminder/ComfyUI-VibeVoice"
Issues = "https://github.com/wildminder/ComfyUI-VibeVoice/issues"

[tool.comfy]
PublisherId = "wildai"
DisplayName = "VibeVoice TTS"
requires-comfyui = ">=0.28.0"
